# Opens an issue when official Telegram (DrKLO/Telegram master) has a newer build
# than the one Foldgram is based on (APP_VERSION_CODE in gradle.properties), so the
# maintainer knows to run update-fork.ps1. No third-party actions are used.
name: Upstream watch

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare upstream build with Foldgram base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No ?ref=: the contents API then reads the default branch (schedule events carry no repository payload).
          ours=$(gh api "repos/$REPO/contents/gradle.properties" --jq .content | base64 -d | sed -n 's/^APP_VERSION_CODE=\([0-9]*\).*/\1/p')
          msg=$(gh api repos/DrKLO/Telegram/commits/master --jq .commit.message | head -n 1)
          up=$(printf '%s\n' "$msg" | sed -n 's/.*update to \([0-9][0-9.]*\) (\([0-9]*\)).*/\2/p')
          ver=$(printf '%s\n' "$msg" | sed -n 's/.*update to \([0-9][0-9.]*\) (\([0-9]*\)).*/\1/p')
          echo "Foldgram base build: ${ours:-?}, upstream: '$msg'"
          if [ -z "$ours" ] || [ -z "$up" ]; then
            echo "Could not parse a build number - nothing to do."
            exit 0
          fi
          if [ "$up" -le "$ours" ]; then
            echo "Up to date."
            exit 0
          fi
          title="Upstream Telegram $ver ($up) is available"
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Issue already open."
            exit 0
          fi
          gh issue create --repo "$REPO" --title "$title" --body "Official Telegram is at $ver (build $up); Foldgram is based on build $ours.

          Run \`update-fork.ps1 -Release\` to rebase the Foldgram patches onto the new version, build and publish a release."
