# Foldgram fork settings. Kept in a separate file so upstream changes to
# gradle.properties never conflict with them during a rebase.

# Android package name (must differ from every official Telegram package).
FOLDGRAM_PACKAGE=io.github.samebeat.foldgram
FOLDGRAM_APP_NAME=Foldgram

# Fork revision on top of the current upstream build (APP_VERSION_CODE in
# gradle.properties). Reset to 1 for every new upstream version, bump it for
# fork-only releases. Release tags are foldgram-<APP_VERSION_CODE>-<revision>.
FOLDGRAM_REVISION=2

# GitHub repository that publishes Foldgram releases (checked by the in-app updater).
FOLDGRAM_GITHUB_REPO=samebeat/Foldgram
